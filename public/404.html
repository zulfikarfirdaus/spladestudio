<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found — Splade Studio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crete+Round:ital@0;1&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Standalone by design — this page is served by Cloudflare Pages for
         unmatched paths, outside the React app, so it carries its own styles. */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fff;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 300;
        text-align: center;
        padding: 24px;
      }
      .code {
        font-family: 'Crete Round', Georgia, serif;
        font-style: italic;
        font-size: clamp(4rem, 18vw, 9rem);
        line-height: 1;
        color: #b9e600;
        margin: 0 0 8px;
      }
      h1 {
        font-size: clamp(1.5rem, 5vw, 2.25rem);
        font-weight: 300;
        letter-spacing: -0.02em;
        margin: 0 0 16px;
      }
      p {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.95rem;
        line-height: 1.6;
        margin: 0 auto 32px;
        max-width: 32ch;
      }
      a {
        display: inline-block;
        padding: 12px 28px;
        border-radius: 999px;
        background: #b9e600;
        color: #000;
        font-size: 0.9rem;
        font-weight: 500;
        text-decoration: none;
        transition: opacity 0.2s ease;
      }
      a:hover { opacity: 0.85; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This page doesn't exist.</h1>
      <p>The link may be broken, or the page may have moved.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
